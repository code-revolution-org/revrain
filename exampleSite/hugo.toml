baseURL = 'https://example.org/'
locale = 'en-US'
title = 'revrain'

theme = "revrain"
themesDir = "../../"

[params]
  logo = "/revrain.png"  # 导航栏 logo，可选；未设置则只显示站点标题 / Nav bar logo, optional; shows site title only if unset
  favicon = "/revrain.png"   # 浏览器标签页图标，可选；未设置则使用默认 favicon.ico / Browser tab icon, optional; defaults to favicon.ico

[menus]
  [[menus.main]]
    name = 'Home'
    pageRef = '/'
    weight = 10

  [[menus.main]]
    name = 'Browse'
    pageRef = '/browse'
    weight = 20

  [[menus.main]]
    name = 'Taxonomy'
    pageRef = '/tags'
    weight = 30

  [[menus.main]]
    name = 'about'
    pageRef = '/about'
    weight = 40

[params.footer]
  github = "https://github.com/code-revolution-org/revrain"
  rss = "/index.xml"

  [[params.footer.links]]
    name = "友情链接"
    url = "https://github.com/code-revolution-org"

# 数字雨配置 / Digital rain config
[params.digitalRain]
  enable = true  # 是否启用 / Enable (true/false)
  chars = "アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ"  # 字符集 / Character set
  fontSize = 14  # 字体大小 / Font size (10-32, px)
  moonChance = 0.02  # 月白色概率 / Moon white probability (0-1)
  resetChance = 0.025  # 重置概率 / Reset probability (0-1)

[module]
  [module.hugoVersion]
    extended = false
    min = '0.146.0'

[markup.tableOfContents]
  startLevel = 2
  endLevel = 6
