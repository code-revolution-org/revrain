<div class="header__brand">
  {{/* 导航栏 logo / Navigation bar logo */}}
  {{ with site.Params.logo }}
    <img class="header__icon" src="{{ relURL . }}" alt="{{ site.Title }}">
  {{ end }}
  <a class="header__title" href="{{ relURL "" }}">{{ site.Title }}</a>
</div>
{{ partial "menu.html" (dict "menuID" "main" "page" .) }}
<button class="header__menu-toggle" aria-label="Toggle menu / 切换菜单" aria-expanded="false">
  <span></span>
  <span></span>
  <span></span>
</button>
