{{ define "main" }}
<section class="error-404">
  <h1 class="error-404__code">404</h1>
  <p class="error-404__text">{{ T "page_not_found" }}</p>
  <div class="error-404__actions">
    <a href="{{ relLangURL "" }}" class="btn btn-primary">{{ T "back_to_home" }}</a>
    <button onclick="history.back()" class="btn btn-secondary">{{ T "go_back" }}</button>
  </div>
</section>
{{ end }}
