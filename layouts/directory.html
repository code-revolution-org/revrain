{{ define "main" }}
{{- if or .Content .Site.Sections }}
<div class="glass-card">
  <h1>{{ .Title }}</h1>
  {{ with .Content }}
  <div>{{ . }}</div>
  {{ end }}

  <div class="card-grid">
    {{ range .Site.Sections }}
    <a href="{{ .RelPermalink }}" class="card-grid-item">
      <h2>{{ .LinkTitle }}</h2>
      <div class="card-meta">
        <span>{{ len .Pages }} pages</span>
        <span>&rarr;</span>
      </div>
    </a>
    {{ end }}
  </div>
</div>
{{- end }}
{{ end }}
