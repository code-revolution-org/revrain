{{ define "main" }}
<div class="about">
  <div class="about__hero">
    {{- with .Params.avatar }}
    <img src="{{ . | relURL }}" alt="{{ $.Title }}" class="about__avatar" />
    {{- end }}
    <h1 class="about__title">{{ .Title }}</h1>
    {{- with .Params.subtitle }}
    <p class="about__subtitle">{{ . }}</p>
    {{- end }}
  </div>

  <div class="about__body">
    <div class="about__content">
      {{ .Content }}
    </div>
  </div>

  {{- with .Params.links }}
  <div class="about__links">
    {{- range . }}
    <a href="{{ .url | urls.AbsURL }}" class="about__link" target="_blank" rel="noopener">
      {{ .name }}
    </a>
    {{- end }}
  </div>
  {{- end }}
</div>
{{ end }}
